<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MotoWeather</title>

  <!-- Damit die Seite auf dem iPhone wie eine App wirkt -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MotoWeather">
  <meta name="theme-color" content="#0F1114">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
  <!-- Versionsnummer (?v=...) bei jedem Update erhöhen, damit Browser und iPhone
       die neuen Dateien laden statt der alten aus dem Cache.
       Dieselbe Nummer steht auch bei den imports oben in js/app.js. -->
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="js/app.js?v=6"></script>
</body>
</html>
